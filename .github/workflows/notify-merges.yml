name: Notificaciones de Merge (dev/test)

# Evento del Anexo del PDF: "Merges exitosos hacia las ramas dev y test".
on:
  push:
    branches: [dev, test]

jobs:
  notificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notificar merge exitoso
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 scripts/notify_telegram.py "🔀 Merge exitoso hacia \`${{ github.ref_name }}\` — commit \`${{ github.sha }}\` por ${{ github.actor }}"

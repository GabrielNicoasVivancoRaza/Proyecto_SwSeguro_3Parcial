# Configuración de SonarCloud (Análisis Estático Tradicional — Shift-Left).
# sonar.organization y sonar.projectKey deben coincidir EXACTAMENTE con los
# creados en https://sonarcloud.io al importar el repositorio (ver
# docs/AVANCE_5_DevSecOps.md, sección "Configurar SonarCloud").

sonar.projectKey=GabrielNicoasVivancoRaza_Proyecto_SwSeguro_3Parcial
sonar.organization=gabrielnicoasvivancoraza

sonar.projectName=Master Gateway
sonar.sources=backend/src,frontend/src
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts,**/coverage/**,**/prisma/migrations/**

sonar.tests=backend/src
sonar.test.inclusions=**/*.spec.ts

# Cobertura de pruebas: generada por `npm run test:cov` en backend/
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=backend/coverage/lcov.info

sonar.sourceEncoding=UTF-8
